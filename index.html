<body>
<div id="root"></div>
<template id="tpl">

<div style="font-family:'Hanken Grotesk',system-ui,sans-serif;color:#0E0E0E;background:#E8E6E2;padding:clamp(8px,2vw,20px);box-sizing:border-box;width:100%">
<div style="background:#F6F5F2;border-radius:clamp(24px,4vw,44px);overflow:hidden;max-width:1360px;margin:0 auto;position:relative">

<!-- Header -->

<div style="display:flex;align-items:center;gap:10px;font-size:15px;line-height:20px;font-weight:500;letter-spacing:-0.01em">
<span aria-hidden="true" style="width:12px;height:12px;border-radius:50%;background:#F25C2F;display:inline-block"></span>
Agustina Chavarini
</div>
<nav aria-label="Secciones" style="display:inline-flex;flex-wrap:wrap;gap:4px">
<button type="button" onClick="{{goHome}}" aria-pressed="{{pHome}}" style="{{sHome}}">General</button>
<button type="button" onClick="{{goCases}}" aria-pressed="{{pCases}}" style="{{sCases}}">Casos</button>
<button type="button" onClick="{{goAbout}}" aria-pressed="{{pAbout}}" style="{{sAbout}}">Sobre mí</button>
</nav>
</header>

<main style="padding:0 clamp(20px,4vw,56px) clamp(32px,5vw,72px);box-sizing:border-box;position:relative;z-index:1">

<!-- ============ GENERALISTA ============ -->
<sc-if value="{{isHome}}" hint-placeholder-val="{{ true }}">
<section style="position:relative;overflow:hidden;padding:clamp(48px,8vw,96px) 0 clamp(64px,8vw,96px)">
<div aria-hidden="true" style="position:absolute;left:50%;top:2%;width:min(560px,70vw);aspect-ratio:1 / 1;transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle at 30% 30%,#B3CFD0 0%,#F3D5C7 48%,#D9F36B 100%);opacity:0.55;filter:blur(64px)"></div>

    while (oldN.childNodes.length > nc.length) oldN.removeChild(oldN.lastChild);
  }
  function wire2(n) {
    if (n.nodeType !== 1) return;
    wire(n);
    for (var c = n.firstChild; c; c = c.nextSibling) wire2(c);
  }

  function decoTitles(root){
    var hs = root.matches && root.matches('h1[data-ct]') ? [root] : [].slice.call(root.querySelectorAll('h1[data-ct]'));
    hs.forEach(function(h){
      var t = h.textContent.replace(/\s+/g,' ').trim(); if(!t || h.querySelector('.ct-a')) return;
      var i = t.indexOf(': '), a = i>0 ? t.slice(0,i) : t, b = i>0 ? t.slice(i+2) : '';
      var w = a.split(' '), last = w.pop();
      h.textContent = '';
      var sa = document.createElement('span'); sa.className='ct-a';
      if (w.length) sa.appendChild(document.createTextNode(w.join(' ')+' '));
      var mk = document.createElement('mark'); mk.textContent = last; sa.appendChild(mk);
      h.appendChild(sa);
      if (b) {
        var p = document.createElement('span'); p.className='ct-p'; p.textContent=': '; h.appendChild(p);
        var sb = document.createElement('span'); sb.className='ct-b'; sb.textContent=b; h.appendChild(sb);
      }
    });
  }
  var firstRender = true;
  function render() {
    var vals = comp.renderVals();
    var out = [];
    buildKids(tplEl.content, vals, out);
    var hdr = null; out.forEach(function(n){ if(!hdr && n.querySelector) hdr = n.matches && n.matches('header.hd') ? n : n.querySelector('header.hd'); });
    if (hdr) hdr.appendChild(mkSwitch());
    if (LANG === 'en') out.forEach(translateTree);
    out.forEach(function(n){ if(n.querySelectorAll) decoTitles(n); });
    document.documentElement.lang = LANG;
    var md = document.querySelector('meta[name=description]'); if (md) md.setAttribute('content', LANG==='en' ? 'Portfolio of Agustina Chavarini: service design, strategy and operations.' : 'Portfolio de Agustina Chavarini: diseño de servicios, estrategia y operaciones.');
    if (firstRender) {
      root.textContent = '';
      out.forEach(function (n) { root.appendChild(n); wire2(n); });
      firstRender = false;
    } else {
      var y = window.scrollY;
      var holder = document.createElement('div');
      out.forEach(function (n) { holder.appendChild(n); });
      morph(root, holder);
      window.scrollTo(0, y);
    }
  }
  window.render = render;
  render();
})();

</script>
