<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agustina Chavarini · Portfolio</title>
<meta name="description" content="Portfolio de Agustina Chavarini: diseño de servicios, estrategia y operaciones.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@200;300;400;500&amp;family=DM+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#E8E6E2}
a{color:#0E0E0E}a:hover{color:#C93F1D}
a:focus-visible,button:focus-visible{outline:3px solid #C93F1D;outline-offset:2px}
button{font-family:inherit}
.exg{display:grid;grid-template-columns:minmax(0,1fr);gap:32px}
.exg.on{grid-template-columns:minmax(0,400px) minmax(0,1fr)}
@media (max-width:980px){.exg.on{grid-template-columns:minmax(0,1fr)}}
.pb{position:relative;container-type:inline-size;width:100%;max-width:1040px;aspect-ratio:1040 / 360;margin:8px auto 16px}
.pb-card{position:absolute;box-sizing:border-box;background:#FFFFFF;border-radius:16px;padding:1.6cqw 1.8cqw;display:flex;flex-direction:column;justify-content:center;gap:0.5cqw;opacity:0;animation:pbin .7s ease-out both}
.pb-k{font-family:'DM Mono',ui-monospace,monospace;font-size:clamp(9px,1.05cqw,11px);letter-spacing:0.06em;text-transform:uppercase;color:#6B6A67}
.pb-t{font-size:clamp(13px,1.7cqw,18px);line-height:1.2;font-weight:500;letter-spacing:-0.01em;color:#0E0E0E}
.pb-b{font-size:clamp(11px,1.3cqw,14px);line-height:1.35;color:#3A3936}
.pb-c1{left:0;top:0;width:30%;height:29%;animation-delay:.1s}
.pb-c2{left:0;top:35.5%;width:30%;height:29%;animation-delay:.5s}
.pb-c3{left:0;top:71%;width:30%;height:29%;animation-delay:.9s}
.pb-out{left:74%;top:23%;width:26%;height:54%;background:#B3CFD0;animation-delay:2.1s}
.pb-out .pb-k{color:#0E0E0E}
.pb-out .pb-b{color:#0E0E0E}
.pb-hub{position:absolute;left:50%;top:50%;width:17cqw;aspect-ratio:1 / 1;transform:translate(-50%,-50%);border-radius:50%;background:#0E0E0E;color:#F6F5F2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0.4cqw;text-align:center;box-shadow:0 0 0 1.2cqw #F6F5F2,0 0 0 1.4cqw #D9F36B;opacity:0;animation:pbpop .7s ease-out 1.5s both}
.pb-hub .pb-t{color:#F6F5F2;font-weight:400;font-size:clamp(16px,2.4cqw,26px)}
.pb-hub .pb-k{color:#A8A6A1}
.pb-lines{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible}
.pb-l{fill:none;stroke:#0E0E0E;stroke-width:1.5;stroke-dasharray:5 7;vector-effect:non-scaling-stroke;opacity:0;animation:pbfade .6s ease-out 1.3s both,pbflow 1.1s linear 1.3s infinite}
.pb-arrow{fill:#0E0E0E;opacity:0;animation:pbfade .6s ease-out 2s both}
.pb-d{left:0;top:35.5%;width:22%;height:29%;animation-delay:.1s}
.pb-hub2{animation-delay:.5s}
.pb-l2{animation:pbfade .6s ease-out .9s both,pbflow 1.1s linear .9s infinite}
.pb-sk{left:70%;width:30%;height:15.6%;justify-content:center;padding-top:0;padding-bottom:0}
.pb-s1{top:0;animation-delay:1.2s}.pb-s2{top:21.1%;animation-delay:1.35s}.pb-s3{top:42.2%;animation-delay:1.5s}.pb-s4{top:63.3%;animation-delay:1.65s}.pb-s5{top:84.4%;animation-delay:1.8s}
@keyframes pbin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pbpop{from{opacity:0;transform:translate(-50%,-50%) scale(.85)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes pbfade{from{opacity:0}to{opacity:1}}
@keyframes pbflow{to{stroke-dashoffset:-12}}
@media (prefers-reduced-motion:reduce){.pb *{animation:none!important;opacity:1!important}}
@media (max-width:720px){.pb{aspect-ratio:auto;display:flex;flex-direction:column;gap:12px}.pb-card,.pb-hub{position:static;width:auto;height:auto;transform:none;padding:16px 20px}.pb-hub{width:132px;height:132px;align-self:center;margin:12px 0;box-shadow:0 0 0 6px #F6F5F2,0 0 0 7px #D9F36B}.pb-lines{display:none}.pb-sk{height:auto}.pb-t{font-size:16px}.pb-b{font-size:14px}.pb-k{font-size:11px}.pb-hub .pb-t{font-size:22px}}
.hd{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px 20px}
@media (max-width:760px){.hd{grid-template-columns:1fr auto}.hd nav{grid-column:1 / -1;grid-row:2;justify-self:start}}
html,body{overflow-x:hidden;-webkit-text-size-adjust:100%}img,video{max-width:100%}
@media (max-width:720px){h1{overflow-wrap:break-word}}
</style>

</head>
<body>
<div id="root"></div>
<template id="tpl">

<div style="font-family:'Hanken Grotesk',system-ui,sans-serif;color:#0E0E0E;background:#E8E6E2;padding:clamp(8px,2vw,20px);box-sizing:border-box;width:100%">
<div style="background:#F6F5F2;border-radius:clamp(24px,4vw,44px);overflow:hidden;max-width:1360px;margin:0 auto;position:relative">

<!-- Header -->
<header class="hd" style="padding:20px clamp(20px,4vw,56px);box-sizing:border-box;position:relative;z-index:2">
<div style="display:flex;align-items:center;gap:10px;font-size:15px;line-height:20px;font-weight:500;letter-spacing:-0.01em">
<span aria-hidden="true" style="width:12px;height:12px;border-radius:50%;background:#F25C2F;display:inline-block"></span>
Agustina Chavarini
</div>
<nav aria-label="Secciones" style="display:inline-flex;flex-wrap:wrap;gap:4px">
<button type="button" onClick="{{goHome}}" aria-pressed="{{pHome}}" style="{{sHome}}">General</button>
<button type="button" onClick="{{goCases}}" aria-pressed="{{pCases}}" style="{{sCases}}">Casos</button>
<button type="button" onClick="{{goAbout}}" aria-pressed="{{pAbout}}" style="{{sAbout}}">Sobre mí</button>
</nav>
</header>

<main style="padding:0 clamp(20px,4vw,56px) clamp(32px,5vw,72px);box-sizing:border-box;position:relative;z-index:1">

<!-- ============ GENERALISTA ============ -->
<sc-if value="{{isHome}}" hint-placeholder-val="{{ true }}">
<section style="position:relative;overflow:hidden;padding:clamp(48px,8vw,96px) 0 clamp(64px,8vw,96px)">
<div aria-hidden="true" style="position:absolute;left:50%;top:2%;width:min(560px,70vw);aspect-ratio:1 / 1;transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle at 30% 30%,#B3CFD0 0%,#F3D5C7 48%,#D9F36B 100%);opacity:0.55;filter:blur(64px)"></div>
<div style="position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:32px">
<span style="display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 16px 0 10px;box-sizing:border-box;border-radius:100px;background:#FFFFFF;font-size:13px;color:#3A3936"><span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 50%; background: rgb(242, 92, 47); display: inline-block"></span>Disponible para nuevos desafíos · Buenos Aires y el mundo</span>
<h1 style="margin: 0; max-width: 960px; font-size: clamp(40px,7vw,96px); line-height: 1; font-weight: 300; letter-spacing: -0.045em; color: #0E0E0E; width: 100%"><span>De procesos <span style="position:relative;display:inline-block"><span style="display:inline-block;clip-path:inset(0 0 46% 0)">desconectados</span><span aria-hidden="true" style="position:absolute;left:0;top:0;display:inline-block;color:#F25C2F;transform:translate(0.05em,0.07em);clip-path:inset(52% 0 0 0)">desconectados</span></span> a sistemas que se <mark style="background:#D9F36B;color:#0E0E0E;padding:0 0.12em;border-radius:0.14em">entienden</mark>.</span></h1>
<p style="margin:0;max-width:640px;font-size:18px;line-height:30px;font-weight:300;color:#3A3936">Estrategia y diseño de servicios para problemas complejos: entender lo que existe, definir cómo debería funcionar y llevarlo a la práctica, de punta a punta.</p>
<div style="display:flex;flex-wrap:wrap;justify-content:center;gap:12px">


</div>
<div role="list" aria-label="Me interesa trabajar en" style="display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:24px">
<sc-for list="{{roles}}" as="r" hint-placeholder-count="5">
<span role="listitem" style="{{r.s}}">{{r.t}}</span>
</sc-for>
</div>
</div>
</section>

<section style="display: flex; flex-direction: column; gap: 48px; padding: clamp(32px,6vw,64px) 0 clamp(64px,8vw,128px); position: relative">
<div style="display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px 32px">
<div style="display:flex;flex-direction:column;gap:12px;max-width:720px">
<div style="font-family:'DM Mono',ui-monospace,monospace;font-size:12px;line-height:16px;letter-spacing:0.06em;text-transform:uppercase;color:#6B6A67">CATÁLOGO · PROYECTOS</div>
<h2 style="margin:0;font-size:clamp(32px,4.6vw,56px);line-height:1.05;font-weight:300;letter-spacing:-0.04em">Casos</h2>
</div>

</div>
<div style="display:flex;flex-wrap:wrap;gap:24px">
<sc-for list="{{cards}}" as="k" hint-placeholder-count="5">
<article style="{{k.box}}">
<div style="{{k.inner}}" aria-hidden="{{k.hid}}">
<div style="{{k.mono}}">{{k.top}}</div>
<h3 style="margin:0;font-size:clamp(24px,2.6vw,32px);line-height:1.1;font-weight:300;letter-spacing:-0.035em">{{k.title}}</h3>
<div style="display:flex;flex-wrap:wrap;gap:6px">
<sc-for list="{{k.tags}}" as="tg" hint-placeholder-count="3">
<span style="{{k.tagStyle}}">{{tg.t}}</span>
</sc-for>
</div>
<div style="margin-top:auto;padding-top:8px;display:flex;align-items:center;justify-content:space-between;gap:12px">
<span style="{{k.role}}">{{k.roleText}}</span>
<button type="button" onClick="{{k.open}}" aria-label="{{k.aria}}" style="{{k.btn}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button>
</div>
</div>
<div style="{{k.ov}}"><span style="display:inline-flex;align-items:center;gap:10px;height:44px;padding:0 22px;border-radius:100px;background:#0E0E0E;color:#D9F36B;font-family:'DM Mono',ui-monospace,monospace;font-size:13px;letter-spacing:0.08em;text-transform:uppercase;box-shadow:0 12px 32px rgba(14,14,14,0.25);">Work in progress</span></div>
</article>
</sc-for>
</div>
</section>
</sc-if>

<!-- ============ CASOS ============ -->
<sc-if value="{{isCases}}" hint-placeholder-val="{{ true }}">
<section style="display:flex;flex-direction:column;gap:clamp(64px,8vw,128px);padding:24px 0 clamp(32px,5vw,64px)">

<!-- Menu horizontal -->
<nav aria-label="Casos" style="display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px">
<sc-for list="{{menu}}" as="m" hint-placeholder-count="5">
<button type="button" onClick="{{m.pick}}" aria-pressed="{{m.pressed}}" style="{{m.style}}">
<span style="{{m.numStyle}}">{{m.n}}</span>{{m.label}}
</button>
</sc-for>
</nav>

<!-- GAL: pirámide de lectura -->
<sc-if value="{{isGal}}" hint-placeholder-val="{{ true }}">
<div style="display:flex;flex-direction:column;gap:clamp(80px,10vw,144px)">

<!-- 1. Apertura -->
<section style="display:flex;flex-wrap:wrap;gap:32px 56px;align-items:flex-start">
<div style="flex:1 1 560px;min-width:0;display:flex;flex-direction:column;gap:32px">
<div style="font-family:'DM Mono',ui-monospace,monospace;font-size:12px;line-height:16px;letter-spacing:0.06em;text-transform:uppercase;color:#C93F1D">Caso 01 · Service Designer Ssr. · OPS · 2026</div>
<h1 style="margin:0;max-width:1000px;font-size:clamp(36px,5.6vw,76px);line-height:1.03;font-weight:300;letter-spacing:-0.045em;color:#0E0E0E">Guazú IA Layer</h1>
<p style="margin:0;max-width:720px;font-size:clamp(20px,2.2vw,28px);line-height:1.3;font-weight:300;letter-spacing:-0.02em;color:#0E0E0E">GAL, una infraestructura de conocimiento para el equipo de diseño.</p>
</div>
<dl style="flex:0 1 320px;min-width:260px;margin:0;display:flex;flex-direction:column;border-top:1px solid #0E0E0E"><div style="display:flex;flex-direction:column;gap:4px;padding:12px 0;border-bottom:1px solid #D9D7D2"><dt style="font-family:'DM Mono',ui-monospace,monospace;font-size:11px;line-height:14px;letter-spacing:0.06em;text-transform:uppercase;color:#6B6A67">Rol</dt><dd style="margin:0;font-size:14px;line-height:20px;color:#0E0E0E">Service Design OPS</dd></div><div style="display:flex;flex-direction:column;gap:4px;padding:12px 0;border-bottom:1px solid #D9D7D2"><dt style="font-family:'DM Mono',ui-monospace,monospace;font-size:11px;line-height:14px;letter-spacing:0.06em;text-transform:uppercase;color:#6B6A67">Equipo</dt><dd style="margin:0;font-size:14px;line-height:20px;color:#0E0E0E">Design OPS</dd></div><div style="display:flex;flex-direction:column;gap:4px;padding:12px 0;border-bottom:1px solid #D9D7D2"><dt style="font-family:'DM Mono',ui-monospace,monospace;font-size:11px;line-height:14px;letter-spacing:0.06em;text-transform:uppercase;color:#6B6A67">Método</dt><dd style="margin:0;font-size:14px;line-height:20px;color:#0E0E0E">Entrevistas a diseñadores, entrevistas a stakeholders ecosistémicos, investigación y talleres</dd></div><div style="display:flex;flex-direction:column;gap:4px;padding:12px 0;border-bottom:1px solid #D9D7D2"><dt style="font-family:'DM Mono',ui-monospace,monospace;font-size:11px;line-height:14px;letter-spacing:0.06em;text-transform:uppercase;color:#6B6A67">Entregable</dt><dd style="margin:0;font-size:14px;line-height:20px;color:#0E0E0E">Capas 1 y 2</dd></div></dl>
</section>

<!-- 2. El problema -->
<section style="display:flex;flex-direction:column;gap:32px">
<div style="font-family:'DM Mono',ui-monospace,monospace;font-size:12px;line-height:16px;letter-spacing:0.06em;text-transform:uppercase;color:#6B6A67">El problema</div>
<h2 style="margin:0;max-width:880px;font-size:clamp(30px,4vw,52px);line-height:1.08;font-weight:300;letter-spacing:-0.04em;color:#0E0E0E">La IA tiene potencial, pero sin concimiento de la empresa está perdida.</h2>
<p style="margin:0;max-width:640px;font-size:16px;line-height:28px;color:#3A3936">Cada diseñador explicaba desde cero producto, usuarios y reglas a sus herramientas de IA. Research y Service Design ya tenían ese conocimiento, pero en formatos que la IA no puede leer.</p>
<div class="pb" role="group" aria-label="Esquema: el conocimiento de Research, Service Design y la empresa llega a GAL, que se lo da a la IA de diseño">
<svg class="pb-lines" viewBox="0 0 1040 360" preserveAspectRatio="none" aria-hidden="true">
<path class="pb-l" d="M312 52 C 372 52, 372 180, 432 180"></path>
<path class="pb-l" d="M312 180 L 432 180"></path>
<path class="pb-l" d="M312 308 C 372 308, 372 180, 432 180"></path>
<path class="pb-l" d="M608 180 L 760 180"></path>
<path class="pb-arrow" d="M770 180 L 756 173 L 756 187 Z"></path>
</svg>
<div class="pb-card pb-c1"><div class="pb-k">Research</div><div class="pb-t">Hallazgos de investigación</div><div class="pb-b">Pain points, insights y patrones, en formatos que la IA no lee.</div></div>
<div class="pb-card pb-c2"><div class="pb-k">Service Design</div><div class="pb-t">Mapeos y blueprints</div><div class="pb-b">Journeys y flujos, guardados fuera del alcance de la IA.</div></div>
<div class="pb-card pb-c3"><div class="pb-k">Empresa</div><div class="pb-t">Producto, usuarios y reglas</div><div class="pb-b">Lo que cada diseñador le explicaba desde cero.</div></div>
<div class="pb-hub"><div class="pb-k">Guazú AI Layer</div><div class="pb-t">GAL</div></div>
<div class="pb-card pb-out"><div class="pb-k">IA de diseño</div><div class="pb-t">Diseña con contexto</div><div class="pb-b">Recibe el conocimiento de la empresa y diseña con criterio.</div></div>
</div>
<p style="margin:0;max-width:720px;font-size:clamp(20px,2.2vw,28px);line-height:1.3;font-weight:300;letter-spacing:-0.02em;color:#0E0E0E">GAL conecta las dos puntas.</p>
</section>

<!-- 4. Cuatro decisiones -->
<section style="display:flex;flex-direction:column;gap:32px">
<div style="font-family:'DM Mono',ui-monospace,monospace;font-size:12px;line-height:16px;letter-spacing:0.06em;text-transform:uppercase;color:#6B6A67">INSTANCIAS DEL PROYECTO</div>
<h2 style="margin:0;max-width:880px;font-size:clamp(30px,4vw,52px);line-height:1.08;font-weight:300;letter-spacing:-0.04em;color:#0E0E0E">Capas de trabajo</h2>
<p style="margin:0;max-width:640px;font-size:16px;line-height:26px;color:#3A3936">GAL se construyó en proyectos independientes: la capa de contexto fue uno y cada skill fue otro.</p>
<div role="group" aria-label="Tipo de capa de trabajo" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;max-width:760px"><sc-for list="{{grpTabs}}" as="g" hint-placeholder-count="2"><button type="button" onClick="{{g.pick}}" aria-pressed="{{g.pressed}}" style="{{g.s}}"><span style="{{g.sk}}">{{g.k}}</span><span style="{{g.st}}">{{g.t}}</span><span style="{{g.sd}}">{{g.d}}</span></button></sc-for></div>
<div style="display:grid;justify-items:center;overflow-x:clip;padding:8px 0 56px">


<article class="{{d1.c}}" style="{{d1.s}}" aria-hidden="{{d1.h}}"><div style="min-width:0;display:flex;flex-direction:column;gap:16px"><div style="display:flex;flex-direction:column;gap:12px"><div style="font-family:'DM Mono',ui-monospace,monospace;letter-spacing:0.06em;text-transform:uppercase;font-size:12px;line-height:16px;color:#6B6A67">Capa contextual</div><h3 style="margin:0;font-size:clamp(21px,1.9vw,25px);line-height:1.12;font-weight:300;letter-spacing:-0.035em">Investigación inicial</h3></div>
<div style="display:flex;flex-direction:column;gap:6px;padding-top:16px;border-top:1px solid #D9D7D2"><div style="font-family:'DM Mono',ui-monospace,monospace;letter-spacing:0.06em;text-transform:uppercase;font-size:11px;line-height:14px;color:#6B6A67">Hallazgo</div><div style="font-size:13px;line-height:21px;color:#3A3936">Esa primera investigación relevó el proceso completo de 12 product designers, desde el entendimiento del problema hasta el handoff, aunque el caso de uso que la disparó fue high fidelity design. Cada participante dibujó su flujo real sin una estructura sugerida y clasificó cada tarea con el semáforo: verde (alto valor creativo), amarillo (repetitiva pero necesaria) y rojo (cuello de botella).</div></div>
<div style="display:flex;flex-direction:column;gap:12px;padding:18px 22px;border-radius:18px;background:#0E0E0E"><div style="font-family:'DM Mono',ui-monospace,monospace;letter-spacing:0.06em;text-transform:uppercase;font-size:11px;line-height:14px;color:#D9F36B">Hallazgo principal</div><div style="font-size:clamp(16px,1.3vw,18px);line-height:1.5;font-weight:300;letter-spacing:-0.01em;color:#F6F5F2">El dolor está alrededor del diseño, no en el diseño. Las tareas creativas son verdes; lo que frustra es lo operativo que las rodea.</div></div>

ación</text></svg><p style="margin:0;font-size:13px;line-height:20px;color:#3A3936">GAL recibe casos de uso, wireframes o user flow, marca y plataforma. Si falta info, consulta antes de avanzar. Al final, el flujo queda listo para content y PM, y legible para Spec Kitti.</p></div>
