<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel de Pagos – Reporte general (prototipo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--blue:#1D4ED8;--blue-d:#1E40AF;--blue-l:#EFF4FF;--ink:#101828;--ink2:#475467;--ink3:#667085;--line:#E4E7EC;--bg:#F5F6F8;--nav:#0F1629}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:13px;overflow:hidden}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select{font-family:inherit;font-size:13px;color:var(--ink)}
.app{display:grid;grid-template-columns:64px 1fr;height:100vh}
.nav{background:var(--nav);display:flex;flex-direction:column;align-items:center;padding:16px 0;gap:14px}
.ni{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:#8A94A8}
.ni.logo{background:#1E2A4A;color:#6EA0FF;width:38px;height:38px}
.ni.back{background:#2563EB;color:#fff;margin-bottom:12px}
.ni.on{background:#2563EB;color:#fff}
.ni.av{margin-top:auto;background:#1E2A4A;color:#C7D0E4;font-size:11px;font-weight:700}
.main{display:flex;flex-direction:column;min-width:0;overflow:auto}
.hdr{background:#fff;padding:20px 28px 0;border-bottom:1px solid #D0D5DD;position:sticky;top:0;z-index:4}
.hdr .row{display:flex;justify-content:space-between;align-items:center}
h1{font-size:22px;font-weight:700;letter-spacing:-.3px}
.live{display:inline-flex;align-items:center;gap:6px;background:#E7F8EF;color:#067647;font-size:10.5px;font-weight:600;border-radius:99px;padding:5px 12px}
.live i{width:6px;height:6px;border-radius:50%;background:#12B76A;box-shadow:0 0 0 0 rgba(18,183,106,.6);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 6px rgba(18,183,106,0)}100%{box-shadow:0 0 0 0 rgba(18,183,106,0)}}
.tabs{display:flex;gap:28px;margin-top:14px}
.tab{display:flex;align-items:center;gap:8px;padding:10px 0 12px;font-size:10.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--ink3);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--blue);border-color:var(--blue)}
.body{padding:26px 28px 60px;display:flex;flex-direction:column;align-items:center;gap:22px}
.card{background:#fff;border:1px solid #EAECF0;border-radius:14px;box-shadow:0 1px 3px rgba(16,24,40,.06);width:100%;max-width:840px}
.cp{padding:20px 18px}
h2{font-size:15px;font-weight:700}
.desc{color:var(--ink3);font-size:11.5px;line-height:1.5;margin-top:6px}
.gen{display:flex;gap:14px;align-items:center;margin-top:16px;flex-wrap:wrap}
.rng{position:relative}
.rf{position:relative;width:232px;height:40px;border:1px solid #98A2B3;border-radius:7px;padding:0 12px;display:flex;align-items:center;justify-content:space-between;background:#fff;cursor:pointer;font-weight:500}
.rf.open{border-color:var(--blue);box-shadow:0 0 0 3px #DBE6FF}
.rf label{position:absolute;top:-8px;left:9px;background:#fff;padding:0 4px;font-size:10px;color:var(--ink3);font-weight:500}
.pop{position:absolute;top:46px;left:0;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(16,24,40,.16);padding:16px;z-index:20;width:300px;display:none}
.pop.show{display:block;animation:fd .15s}
@keyframes fd{from{opacity:0;transform:translateY(-4px)}to{opacity:1}}
.pop label{display:block;font-size:11px;font-weight:600;color:var(--ink2);margin:0 0 5px}
.pop input{width:100%;height:36px;border:1px solid #D0D5DD;border-radius:7px;padding:0 10px;margin-bottom:12px}
.pop .pr{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.chip{border:1px solid var(--line);border-radius:99px;padding:4px 10px;font-size:11px;font-weight:600;color:var(--ink2)}
.chip:hover{background:var(--blue-l);border-color:#B2CCFF;color:var(--blue)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 20px;border-radius:8px;font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;transition:.15s}
.btn.pri{background:var(--blue);color:#fff;box-shadow:0 1px 2px rgba(29,78,216,.4)}
.btn.pri:hover{background:var(--blue-d)}
.btn.pri:disabled{background:#93B0F2;cursor:not-allowed;box-shadow:none}
.btn.out{border:1px solid #B2CCFF;color:var(--blue);height:30px;padding:0 12px;font-size:9.5px;border-radius:6px}
.btn.out:hover{background:var(--blue-l)}
.btn.sm{height:34px;padding:0 14px}
/* motor */
.motor{margin-top:16px;border:1px solid #D1E0FF;background:#F5F8FF;border-radius:10px;padding:14px 16px;display:none}
.motor.show{display:block;animation:fd .25s}
.motor h4{font-size:11.5px;color:var(--blue);display:flex;align-items:center;gap:8px;margin-bottom:10px}
.mw{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 14px}
.mi{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--ink3)}
.mi .d{width:16px;height:16px;border-radius:50%;border:2px solid #D0D5DD;flex:none;display:grid;place-items:center}
.mi.run{color:var(--ink);font-weight:600}
.mi.run .d{border-color:var(--blue);border-top-color:transparent;animation:sp .7s linear infinite}
.mi.ok{color:var(--ink)}
.mi.ok .d{background:#12B76A;border-color:#12B76A;animation:none}
.mi.ok .d::after{content:'';width:4px;height:7px;border:solid #fff;border-width:0 1.8px 1.8px 0;transform:rotate(45deg) translate(-.5px,-.5px)}
.pb{height:5px;background:#DCE6FB;border-radius:9px;margin-top:12px;overflow:hidden}.pb i{display:block;height:100%;width:0;background:var(--blue);transition:width .5s}
@keyframes sp{to{transform:rotate(360deg)}}
table{width:100%;border-collapse:collapse}
thead th{background:#F2F4F7;font-size:9.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--ink2);font-weight:700;text-align:left;padding:13px 18px;border-bottom:1.5px solid #475467}
thead th:last-child,td:last-child{text-align:right}
td{padding:14px 18px;border-bottom:1px solid #F2F4F7;font-size:11.5px;color:#1D2939;height:47px}
tr:last-child td{border:0}
tbody tr:hover{background:#FAFBFC}
.hist{overflow:hidden}.hist .cp{padding-bottom:14px}
.st{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:3px 9px;font-size:10px;font-weight:600;border:1px solid;cursor:default}
.st.t{background:#F2F4F7;color:#344054;border-color:#E4E7EC}.st.t::before{content:'';width:5px;height:5px;border-radius:50%;background:#667085}
.st.e{background:#FEF3F2;color:#B42318;border-color:#FDA29B;cursor:pointer}
.st.p{background:#FFFAEB;color:#B54708;border-color:#FEDF89}
.st.p i{width:9px;height:9px;border:2px solid #B54708;border-top-color:transparent;border-radius:50%;animation:sp .7s linear infinite}
.dash{color:#98A2B3}
@keyframes flash{0%{background:#EEF4FF}100%{background:transparent}}
tr.new{animation:flash 3s ease-out}
.tip{position:fixed;background:#101828;color:#fff;font-size:11px;line-height:1.45;padding:9px 12px;border-radius:8px;max-width:260px;z-index:90;display:none;box-shadow:0 8px 24px rgba(0,0,0,.25)}
/* modal */
.ov{position:fixed;inset:0;background:rgba(16,24,40,.55);display:none;align-items:center;justify-content:center;z-index:60;padding:20px}
.ov.show{display:flex;animation:fd .18s}
.modal{background:#fff;border-radius:14px;width:880px;max-width:100%;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 24px 64px rgba(16,24,40,.3);animation:pop .22s}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.mh{padding:20px 24px 14px;display:flex;justify-content:space-between;align-items:flex-start;border-bottom:1px solid var(--line)}
.mh h3{font-size:17px;font-weight:700}.mh p{font-size:12px;color:var(--ink3);margin-top:3px}
.x{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--ink3)}.x:hover{background:#F2F4F7}
.mb{overflow:auto;flex:1}
.mf{padding:14px 24px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;background:#FCFCFD;border-radius:0 0 14px 14px}
.kp{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:16px 24px}
.k{border:1px solid var(--line);border-radius:10px;padding:10px 14px}.k small{font-size:10px;font-weight:600;color:var(--ink3);text-transform:uppercase;letter-spacing:.4px}.k b{display:block;font-size:16px;margin-top:3px;font-variant-numeric:tabular-nums}
.k.neto{background:var(--blue-l);border-color:#B2CCFF}.k.neto b{color:var(--blue)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.neg{color:#B42318}.pos{color:#067647}
tfoot td{font-weight:700;background:#F9FAFB;border-top:1.5px solid #475467}
.mb table th:not(:first-child),.mb table td:not(:first-child){text-align:right}
.fr{display:flex;gap:14px;align-items:end;margin-top:16px;flex-wrap:wrap}
.fr .sel{height:40px;border:1px solid #98A2B3;border-radius:7px;padding:0 12px;min-width:232px;background:#fff}
.lab{font-size:10.5px;font-weight:600;color:var(--ink3);display:block;margin-bottom:5px}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(18px);background:#101828;color:#fff;padding:12px 18px;border-radius:10px;font-weight:600;font-size:12.5px;display:flex;gap:10px;align-items:center;opacity:0;pointer-events:none;transition:.25s;z-index:99}
.toast.show{opacity:1;transform:translateX(-50%)}
.empty{text-align:center;color:var(--ink3);padding:36px 0}
</style>
</head>
<body>
<div class="app">
  <aside class="nav">
    <div class="ni"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></div>
    <div class="ni logo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="16" r="3.2"/><circle cx="18" cy="16" r="3.2"/><path d="M6 16l4-8h4l4 8M10 8 9 6"/></svg></div>
    <div class="ni back"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5m6-6-6 6 6 6"/></svg></div>
    <div class="ni"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></div>
    <div class="ni"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6M17 4.5a3.5 3.5 0 0 1 0 7M18 14c2.4.6 3.5 2.5 3.5 6"/></svg></div>
    <div class="ni"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21Z"/><circle cx="12" cy="9.5" r="2.5"/></svg></div>
    <div class="ni"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></div>
    <div class="ni"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h3"/></svg></div>
    <div class="ni"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/></svg></div>
    <div class="ni on"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3h9l4 4v14H6z"/><path d="M9 12h7M9 16h7M9 8h3"/></svg></div>
    <div class="ni av">AC</div>
  </aside>
  <section class="main">
    <div class="hdr">
      <div class="row"><h1>Pagos</h1><span class="live"><i></i>Sistema de Liquidación Activo</span></div>
      <div class="tabs">
        <button class="tab on" data-t="g"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h3"/></svg>Reporte general</button>
        <button class="tab" data-t="i"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6M17 4.5a3.5 3.5 0 0 1 0 7"/></svg>Reporte individual por driver</button>
      </div>
    </div>
    <div class="body" id="body"></div>
  </section>
</div>

<div class="ov" id="ov"><div class="modal" id="modal"></div></div>
<div class="tip" id="tip"></div>
<div class="toast" id="toast"></div>

<script>
const $=s=>document.querySelector(s);
const fmt=n=>(n<0?'-':'')+String(Math.abs(Math.round(n))).replace(/\B(?=(\d{3})+(?!\d))/g,'.');
const gs=n=>fmt(n)+' Gs';
const dmy=iso=>iso.split('-').reverse().join('/');
const pad=n=>String(n).padStart(2,'0');
const DRIVERS=['Carlos Alberto Gómez','Roberto Benítez','Maria José Ayala','Gustavo Dávalos','Lucía Fernández','Diego Martínez','Andrea Villalba','Sofía Romero','Javier Acosta','Marcos Giménez','Valeria Cabrera'];

let hist=[
 {r:'10/09/2025 - 19/09/2025',c:'19/09/2025 - 19:02 h',s:'t'},
 {r:'10/09/2025 - 11/09/2025',c:'12/09/2025 - 19:02 h',s:'t'},
 {r:'28/08/2025 - 09/09/2025',c:'10/09/2025 - 19:02 h',s:'e',why:'Falló la conexión con Admin 2: tiempo de espera agotado al traer los viajes del período.'},
 {r:'04/09/2025 - 04/09/2025',c:'05/09/2025 - 19:02 h',s:'t'},
 {r:'15/08/2025 - 30/08/2025',c:'03/09/2025 - 19:02 h',s:'t'},
 {r:'27/08/2025 - 28/08/2025',c:'28/08/2025 - 19:02 h',s:'t'},
 {r:'20/08/2025 - 21/08/2025',c:'21/08/2025 - 19:02 h',s:'t'},
];
let tab='g', range={a:'2025-09-22',b:'2025-09-23'}, running=false, indDriver='', indRange={a:'2025-09-22',b:'2025-09-23'};
let nid=1;

/* datos simulados (deterministas por rango y driver) */
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const hash=s=>[...s].reduce((h,c)=>(h*31+c.charCodeAt(0))|0,7);
function days(a,b){return Math.max(1,Math.round((new Date(b)-new Date(a))/864e5)+1)}
function dataFor(a,b){
  const n=days(a,b);
  return DRIVERS.map(name=>{
    const R=rng(hash(name+a+b)); const k=x=>Math.round(x/1000)*1000;
    const km=k((260000+R()*320000)*n), bon=k(R()*90000*n), inc=R()<.45?k(R()*60000*Math.sqrt(n)):0,
          eq=R()<.4?k(40000+R()*60000):0, ade=R()<.3?k(100000+R()*200000):0;
    return {name,km,bon,inc,eq,ade,neto:km+bon-inc-eq-ade};
  });
}
function now(){const d=new Date();return `22/09/2025 - ${pad(d.getHours())}:${pad(d.getMinutes())} h`}

/* componente rango de fechas */
function rangeField(id,r){
  return `<div class="rng"><div class="rf" id="${id}"><label>Rango de fechas</label><span>${dmy(r.a)} - ${dmy(r.b)}</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#667085" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></div>
  <div class="pop" id="${id}-p"><div class="pr"><button class="chip" data-p="1">Ayer</button><button class="chip" data-p="7">Últimos 7 días</button><button class="chip" data-p="15">Quincena</button></div>
  <label>Desde</label><input type="date" id="${id}-a" value="${r.a}"><label>Hasta</label><input type="date" id="${id}-b" value="${r.b}">
  <button class="btn pri sm" id="${id}-ok" style="width:100%">Aplicar</button></div></div>`;
}
function bindRange(id,r,onChange){
  const f=$('#'+id),p=$('#'+id+'-p');
  f.onclick=()=>{p.classList.toggle('show');f.classList.toggle('open')};
  p.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{const n=+c.dataset.p;const end=new Date('2025-09-21');const st=new Date(end);st.setDate(end.getDate()-n+1);
    $('#'+id+'-a').value=st.toISOString().slice(0,10);$('#'+id+'-b').value=end.toISOString().slice(0,10)});
  $('#'+id+'-ok').onclick=()=>{const a=$('#'+id+'-a').value,b=$('#'+id+'-b').value;if(!a||!b||a>b){toast('Revisá el rango de fechas');return}
    r.a=a;r.b=b;p.classList.remove('show');f.classList.remove('open');f.querySelector('span').textContent=`${dmy(a)} - ${dmy(b)}`;onChange&&onChange()};
}
document.addEventListener('click',e=>{document.querySelectorAll('.pop.show').forEach(p=>{if(!p.parentElement.contains(e.target)){p.classList.remove('show');p.parentElement.querySelector('.rf').classList.remove('open')}})});

/* vistas */
function render(){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.t===tab));
  tab==='g'?viewG():viewI();
}
function viewG(){
  $('#body').innerHTML=`<div class="card cp"><h2>Generar reporte general</h2>
  <p class="desc">Seleccioná el rango de fechas para generar el reporte de pagos de todos los drivers que trabajaron en ese período, una vez esté listo, lo podrás descargar desde el listado abajo.</p>
  <div class="gen">${rangeField('rg',range)}<button class="btn pri" id="gb" ${running?'disabled':''}>Generar reporte</button></div>
  <div class="motor" id="motor"></div></div>
  <div class="card hist"><div class="cp"><h2>Historial de reportes generados</h2><p class="desc" style="margin-top:3px">Acá podrás encontrar los últimos 10 reportes que generaste y descargarlos.</p></div>
  <table><thead><tr><th>Rango de fechas</th><th>Fecha de creación del reporte</th><th>Estado</th><th>Acción</th></tr></thead><tbody id="tb"></tbody></table></div>`;
  bindRange('rg',range);
  $('#gb').onclick=generar; drawRows();
}
function drawRows(newIdx=-1){
  $('#tb').innerHTML=hist.map((h,i)=>`<tr class="${h.id&&h.id===newIdx?'new':''}"><td>${h.r}</td><td>${h.c}</td>
  <td>${h.s==='t'?'<span class="st t">Terminado</span>':h.s==='e'?`<span class="st e" data-why="${h.why||'Error inesperado al consolidar los datos.'}"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16.5v.5"/></svg>Error</span>`:'<span class="st p"><i></i>En progreso</span>'}</td>
  <td>${h.s==='t'?`<button class="btn out" data-i="${i}">Descargar</button>`:h.s==='e'?`<button class="btn out" data-r="${i}">Reintentar</button>`:'<span class="dash">-</span>'}</td></tr>`).join('');
  document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>openReport(hist[+b.dataset.i].r));
  document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>reintentar(+b.dataset.r));
  document.querySelectorAll('.st.e').forEach(s=>{
    s.onmouseenter=()=>{const t=$('#tip'),r=s.getBoundingClientRect();t.textContent=s.dataset.why;t.style.display='block';t.style.left=Math.min(r.left,innerWidth-280)+'px';t.style.top=(r.top-t.offsetHeight-8)+'px'};
    s.onmouseleave=()=>$('#tip').style.display='none';
  });
}
const PASOS=['Ganancia por KM','Ganancia por bonos y extras','Descuentos por incidencias','Descuentos por compra de equipos','Montos pendientes','Cálculo de adelantos'];
function motor(done){
  const m=$('#motor');m.classList.add('show');
  m.innerHTML=`<h4><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>Motor de conciliación · consumiendo Admin 2, Ondanet, SET/SIFEN y Ueno Bank en tiempo real</h4>
  <div class="mw">${PASOS.map((p,i)=>`<div class="mi" id="mi${i}"><div class="d"></div>${p}</div>`).join('')}</div><div class="pb"><i id="pbi"></i></div>`;
  let i=0;const step=()=>{ if(i>0)$('#mi'+(i-1)).className='mi ok'; $('#pbi').style.width=(i/PASOS.length*100)+'%';
    if(i<PASOS.length){$('#mi'+i).className='mi run';i++;setTimeout(step,780)}else{$('#pbi').style.width='100%';setTimeout(done,450)}};
  step();
}
function generar(){
  if(running)return; running=true; $('#gb').disabled=true;
  const label=`${dmy(range.a)} - ${dmy(range.b)}`;
  const row={r:label,c:now(),s:'p',id:nid++}; hist.unshift(row); if(hist.length>10)hist.pop(); drawRows(row.id);
  motor(()=>{row.s='t';running=false;drawRows(row.id);const g=$('#gb');if(g)g.disabled=false;const m=$('#motor');if(m)m.classList.remove('show');toast('Reporte listo para descargar · '+label)});
}
function reintentar(i){
  if(running)return; running=true; const h=hist[i]; h.s='p'; h.c=now(); drawRows(); const g=$('#gb');if(g)g.disabled=true;
  motor(()=>{h.s='t';running=false;drawRows();const g=$('#gb');if(g)g.disabled=false;const m=$('#motor');if(m)m.classList.remove('show');toast('Reporte regenerado correctamente')});
}
function openReport(label){
  const [a,b]=label.split(' - ').map(x=>x.split('/').reverse().join('-'));
  const D=dataFor(a,b), T=k=>D.reduce((s,d)=>s+d[k],0);
  $('#modal').innerHTML=`<div class="mh"><div><h3>Reporte general de pagos</h3><p>Período ${label} · ${D.length} drivers liquidados · consolidado en un solo documento</p></div><button class="x" id="mx"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
  <div class="mb"><div class="kp"><div class="k"><small>Ganancia por KM</small><b>${gs(T('km'))}</b></div><div class="k"><small>Bonos y extras</small><b>${gs(T('bon'))}</b></div><div class="k"><small>Descuentos</small><b class="neg">${gs(-(T('inc')+T('eq')+T('ade')))}</b></div><div class="k neto"><small>Neto a pagar</small><b>${gs(T('neto'))}</b></div></div>
  <table><thead><tr><th>Driver</th><th>Ganancia KM</th><th>Bonos y extras</th><th>Desc. incidencias</th><th>Desc. equipos</th><th>Adelantos</th><th>Neto</th></tr></thead><tbody>
  ${D.map(d=>`<tr><td>${d.name}</td><td class="num">${fmt(d.km)}</td><td class="num">${fmt(d.bon)}</td><td class="num ${d.inc?'neg':''}">${d.inc?fmt(-d.inc):'—'}</td><td class="num ${d.eq?'neg':''}">${d.eq?fmt(-d.eq):'—'}</td><td class="num ${d.ade?'neg':''}">${d.ade?fmt(-d.ade):'—'}</td><td class="num"><b>${fmt(d.neto)}</b></td></tr>`).join('')}
  </tbody><tfoot><tr><td>Total</td><td class="num">${fmt(T('km'))}</td><td class="num">${fmt(T('bon'))}</td><td class="num">${fmt(-T('inc'))}</td><td class="num">${fmt(-T('eq'))}</td><td class="num">${fmt(-T('ade'))}</td><td class="num">${fmt(T('neto'))}</td></tr></tfoot></table></div>
  <div class="mf"><span style="font-size:11.5px;color:var(--ink3)">Datos conciliados con Admin 2, Ondanet y Ueno Bank</span><div style="display:flex;gap:10px"><button class="btn out sm" id="mc" style="height:34px">Cerrar</button><button class="btn pri sm" id="md">Descargar .xlsx</button></div></div>`;
  $('#ov').classList.add('show');
  $('#mx').onclick=$('#mc').onclick=()=>$('#ov').classList.remove('show');
  $('#md').onclick=()=>{$('#ov').classList.remove('show');toast('Descargando reporte_'+a+'_'+b+'.xlsx')};
}
$('#ov').onclick=e=>{if(e.target.id==='ov')$('#ov').classList.remove('show')};
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#ov').classList.remove('show')});

function viewI(){
  $('#body').innerHTML=`<div class="card cp"><h2>Reporte individual por driver</h2>
  <p class="desc">Elegí un driver y un período para ver el detalle de su liquidación: de dónde sale cada monto y qué descuentos se aplicaron.</p>
  <div class="fr"><div><span class="lab">Driver</span><select class="sel" id="isel"><option value="">Seleccionar driver…</option>${DRIVERS.map(d=>`<option ${indDriver===d?'selected':''}>${d}</option>`).join('')}</select></div>${rangeField('ri',indRange)}</div></div>
  <div id="ires" style="width:100%;display:flex;flex-direction:column;align-items:center"></div>`;
  $('#isel').onchange=e=>{indDriver=e.target.value;drawInd()};
  bindRange('ri',indRange,drawInd); drawInd();
}
function drawInd(){
  const el=$('#ires'); if(!el)return;
  if(!indDriver){el.innerHTML='<div class="card empty" style="max-width:840px">Seleccioná un driver para ver su liquidación</div>';return}
  const d=dataFor(indRange.a,indRange.b).find(x=>x.name===indDriver);
  const L=[['Ganancia por KM','Admin 2',d.km],['Ganancia por bonos y extras','Admin 2',d.bon],['Descuentos por incidencias','Soporte',-d.inc],['Descuentos por compra de equipos','Módulo Equipos',-d.eq],['Adelantos','Ueno Bank',-d.ade]];
  el.innerHTML=`<div class="card hist" style="margin-top:0"><div class="cp" style="display:flex;justify-content:space-between;align-items:center"><div><h2>${d.name}</h2><p class="desc" style="margin-top:3px">Período ${dmy(indRange.a)} - ${dmy(indRange.b)}</p></div><div style="text-align:right"><span class="lab" style="margin:0">Neto a pagar</span><b style="font-size:20px;color:var(--blue)">${gs(d.neto)}</b></div></div>
  <table><thead><tr><th>Concepto</th><th style="text-align:left">Fuente</th><th>Monto</th></tr></thead><tbody>
  ${L.map(l=>`<tr><td>${l[0]}</td><td style="text-align:left;color:var(--ink3)">${l[1]}</td><td class="num ${l[2]<0?'neg':''}">${l[2]?gs(l[2]):'—'}</td></tr>`).join('')}</tbody>
  <tfoot><tr><td colspan="2">Neto</td><td class="num">${gs(d.neto)}</td></tr></tfoot></table></div>`;
}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{tab=t.dataset.t;render()});
function toast(m){const t=$('#toast');t.innerHTML='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#32D583" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg>'+m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),3000)}
render();
</script>
</body>
</html>
